name: Feature request
description: Suggest a new feature or an improvement to CleanBot.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Manage tab
        - Individual tab (gear, inventory, strategies)
        - Quest Log
        - Group tab
        - Mini Action Bar
        - Settings / themes
        - Other / new area
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that's hard or impossible today?
      placeholder: "When I'm running a raid with 20 bots, I have to ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature. Mock-ups or screenshots from other addons are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you do today instead (chat commands, macros, other addons).
